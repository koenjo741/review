<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Thesis Reviewer</title><style>body{font-family:sans-serif;max-width:900px;margin:20px auto;padding:20px;line-height:1.6}textarea{width:100%;height:200px;padding:10px;margin-bottom:10px}button{padding:10px 20px;background-color:#007bff;color:white;border:none;cursor:pointer}#results{margin-top:30px;border-top:2px solid #eee;padding-top:20px}.critique{background:#f9f9f9;padding:15px;border-left:5px solid #007bff;margin-bottom:10px}.revised{background:#e7f3ff;padding:15px;border:1px solid #b3d7ff;white-space:pre-wrap}</style></head><body><h1>Master-Thesis Evaluator</h1><p>Fügen Sie hier ein Kapitel oder einen Absatz ein:</p><textarea id="inputText" placeholder="Text hier einfügen..."></textarea><button onclick="startReview()">Evaluierung starten</button><div id="results" style="display:none"></div><script>async function startReview(){const text=document.getElementById('inputText').value;const resDiv=document.getElementById('results');if(!text)return alert('Bitte Text eingeben');resDiv.style.display='block';resDiv.innerHTML='Prüfung läuft... Bitte warten (Agenten A, B und C arbeiten)...';try{const response=await fetch('/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})});const data=await response.json();let critiqueHtml='';data.kritikpunkte.forEach(item=>{critiqueHtml+=`<div class="critique"><strong>${item.kategorie}</strong><br><em>\"${item.original_zitat}\"</em><br>${item.kritikpunkt}<br><small>Evidenz: ${item.evidenz_nachweis}</small></div>`});resDiv.innerHTML=`<h2>Gutachten</h2><p><strong>Tendenz:</strong> ${data.gesamtnote_tendenz}</p>${critiqueHtml}<h3>Überarbeiteter Vorschlag:</h3><div class="revised">${data.ueberarbeiteter_absatz}</div>`}catch(error){resDiv.innerHTML='Fehler bei der Verarbeitung. Prüfen Sie die Konsole.';console.error(error)}}</script></body></html>
