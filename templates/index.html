<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Master-Thesis Evaluator Pro</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { color: #003366; border-bottom: 3px solid #003366; padding-bottom: 10px; }
        .section { background: #fafbfc; border: 1px solid #e1e4e8; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .upload-zone { background: #eef2f7; border: 2px dashed #003366; text-align: center; padding: 30px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #003366; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #002244; }
        #status-box { background: #e6f4ea; padding: 15px; border-radius: 8px; display: none; margin-top: 20px; }
        .scrollable { max-height: 200px; overflow-y: auto; background: white; padding: 10px; border: 1px solid #ddd; margin-top: 5px; font-family: monospace; font-size: 13px; }
        .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .col { padding: 15px; border-radius: 8px; border: 1px solid #ddd; background: #fff; line-height: 1.6; }
        .highlight { background: #fff3cd; border-bottom: 2px solid #ffeeba; }
        .badge { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <h1>Master-Thesis Evaluator <small>(AI-Course Optimized)</small></h1>

    <!-- PDF UPLOAD -->
    <div class="upload-zone">
        <h3>Phase 0: PDF-Direkt-Upload (Tag 8)</h3>
        <p>Lade die Arbeit als PDF hoch, um TOC, Literatur und Text automatisch zu extrahieren.</p>
        <input type="file" id="pdf-file" accept="application/pdf">
        <button onclick="uploadPDF()" id="upload-btn">PDF analysieren</button>
    </div>

    <!-- INITIALISIERUNG -->
    <div class="section">
        <h3>Phase 1: Initialisierung</h3>
        <label>Inhaltsverzeichnis:</label>
        <textarea id="toc"></textarea>
        <label>Literaturverzeichnis:</label>
        <textarea id="bibliography"></textarea>
        <label>Text-Ausschnitt:</label>
        <textarea id="draft_text"></textarea>
        <button onclick="initializeWork()" id="init-btn" style="margin-top:15px;">Arbeit validieren</button>
    </div>

    <div id="status-box">
        <strong>Literatur-Check:</strong>
        <div id="bib-content" class="scrollable"></div>
        <strong>Struktur-Analyse:</strong>
        <div id="struct-content" class="scrollable"></div>
    </div>

    <!-- EVALUIERUNG -->
    <div class="section" id="eval-section" style="opacity:0.5; pointer-events:none;">
        <h3>Phase 2: Absatz-Lektorat (RAG-gestützt)</h3>
        <textarea id="paragraph" placeholder="Absatz hier einfügen..."></textarea>
        <button onclick="evaluateParagraph()" id="eval-btn" style="margin-top:10px;">Absatz prüfen</button>
    </div>

    <div id="result-container"></div>
</div>

<script>
    let globalContext = "";

    function uploadPDF() {
        const file = document.getElementById('pdf-file').files[0];
        const btn = document.getElementById('upload-btn');
        if(!file) return alert("Datei wählen!");

        btn.innerText = "Gemini liest PDF...";
        const formData = new FormData();
        formData.append('file', file);

        fetch('/process_pdf', { method: 'POST', body: formData })
        .then(r => r.json())
        .then(data => {
            if(data.error) throw data.error;
            document.getElementById('toc').value = data.toc;
            document.getElementById('bibliography').value = data.bibliography;
            document.getElementById('draft_text').value = data.draft_text;
            btn.innerText = "PDF extrahiert!";
            btn.style.background = "#28a745";
        })
        .catch(e => { alert(e); btn.innerText = "Fehler!"; });
    }

    function initializeWork() {
        const btn = document.getElementById('init-btn');
        btn.innerText = "Validiere...";
        
        const payload = {
            toc: document.getElementById('toc').value,
            bibliography: document.getElementById('bibliography').value,
            draft_text: document.getElementById('draft_text').value
        };

        fetch('/initialize', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            if(data.error) throw data.error;
            globalContext = data.full_context;
            
            let bibHtml = data.bibliography_check.map(e => 
                `<div>[${e.status}] ${e.id}: ${e.text.substring(0,50)}... (${e.reason})</div>`
            ).join('');
            
            document.getElementById('bib-content').innerHTML = bibHtml;
            document.getElementById('struct-content').innerText = data.structural_analysis;
            document.getElementById('status-box').style.display = 'block';
            document.getElementById('eval-section').style.opacity = '1';
            document.getElementById('eval-section').style.pointerEvents = 'auto';
            btn.innerText = "Arbeit bereit!";
        })
        .catch(e => alert(e));
    }

    function evaluateParagraph() {
        const btn = document.getElementById('eval-btn');
        const para = document.getElementById('paragraph').value;
        btn.innerText = "Analysiere mit RAG...";

        fetch('/evaluate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ paragraph: para, context_summary: globalContext })
        })
        .then(r => r.json())
        .then(data => {
            let html = `<div class="section" style="background:white;">
                <h3>Gutachten (Tendenz: ${data.gesamtnote_tendenz})</h3>
                <ul>` + data.kritikpunkte.map(k => 
                    `<li><span class="badge">${k.kategorie}</span> <b>"${k.original_zitat}"</b>: ${k.kritikpunkt}</li>`
                ).join('') + `</ul>
                <div class="comparison-grid">
                    <div class="col"><b>Original:</b><br>${para}</div>
                    <div class="col" style="background:#f0f7ff;"><b>Vorschlag:</b><br>${data.ueberarbeiteter_absatz}</div>
                </div>
            </div>`;
            document.getElementById('result-container').innerHTML = html;
            btn.innerText = "Absatz prüfen";
        })
        .catch(e => alert(e));
    }
</script>
</body>
</html>
