<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Master-Thesis Evaluator Pro v3.0</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .upload-zone { background: #eef2f7; border: 2px dashed #003366; text-align: center; padding: 30px; border-radius: 8px; }
        textarea { width: 100%; height: 120px; padding: 10px; border-radius: 4px; border: 1px solid #ccc; margin-top: 5px; }
        button { background: #003366; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #progress-log { margin-top: 10px; color: #003366; font-weight: bold; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Master-Thesis Evaluator <small>v3.0 (Hybrid-Parsing)</small></h1>

    <div class="upload-zone">
        <h3>PDF-Upload & Intelligente Segmentierung</h3>
        <input type="file" id="pdf-file" accept="application/pdf">
        <br><br>
        <button onclick="uploadPDF()" id="upload-btn">Arbeit analysieren</button>
        <div id="progress-log">KI analysiert Teilstücke (TOC, Bib, Intro)... Bitte warten.</div>
    </div>

    <div class="section">
        <h3>Extrahierte Daten</h3>
        <label>Inhaltsverzeichnis:</label>
        <textarea id="toc"></textarea>
        <label>Literaturverzeichnis:</label>
        <textarea id="bibliography"></textarea>
        <label>Einleitungstext:</label>
        <textarea id="draft_text"></textarea>
        <button onclick="initializeWork()" id="init-btn" style="margin-top:10px;">Daten validieren</button>
    </div>

    <div id="result-container"></div>
</div>

<script>
    async function uploadPDF() {
        const fileInput = document.getElementById('pdf-file');
        const btn = document.getElementById('upload-btn');
        const log = document.getElementById('progress-log');
        
        if(!fileInput.files[0]) return alert("Bitte PDF wählen.");

        btn.disabled = true;
        log.style.display = "block";

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            // Timeout auf 5 Minuten erhöhen für große PDFs
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000);

            const response = await fetch('/process_pdf', { 
                method: 'POST', 
                body: formData,
                signal: controller.signal 
            });
            const data = await response.json();
            
            document.getElementById('toc').value = data.toc;
            document.getElementById('bibliography').value = data.bibliography;
            document.getElementById('draft_text').value = data.draft_text;
            
            log.innerText = "✓ Analyse abgeschlossen!";
            btn.style.background = "#28a745";
        } catch (e) {
            alert("Fehler: " + e.message);
            btn.style.background = "#dc3545";
        } finally {
            btn.disabled = false;
        }
    }

    async function initializeWork() {
        // ... (bestehende Logik)
    }
</script>
</body>
</html>
