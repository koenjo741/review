<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Thesis Reviewer</title>
    <style>
        body { font-family: sans-serif; max-width: 1100px; margin: 20px auto; padding: 20px; line-height: 1.6; }
        
        /* Kombiniertes Eingabefeld für Text und Bilder (contenteditable) */
        #inputContainer { 
            width: 100%; 
            min-height: 350px; 
            max-height: 600px;
            overflow-y: auto;
            padding: 15px; 
            margin-bottom: 10px; 
            box-sizing: border-box; 
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            white-space: pre-wrap;
            word-break: break-word;
        }
        #inputContainer:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        #inputContainer img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .button-group { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        
        /* Basis-Styling für den Haupt-Evaluierungsbutton */
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; transition: background-color 0.3s ease; }
        button.secondary { background-color: #6c757d; }
        button:hover { opacity: 0.9; }
        
        #results { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; display: none; }
        .critique { background: #f9f9f9; padding: 15px; border-left: 5px solid #007bff; margin-bottom: 10px; }
        
        /* 2-spaltiges Layout für den Vergleich */
        .comparison-container {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .comparison-column {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
        .original-col {
            background-color: #fdfbf7;
            border-color: #e5dfd3;
        }
        .revised-col {
            background-color: #e7f3ff;
            border-color: #b3d7ff;
        }
        .column-title {
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            font-size: 0.95em;
            color: #444;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 5px;
        }

        @media (max-width: 768px) {
            .comparison-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <h1>Master-Thesis Evaluator</h1>
    <p>Fügen Sie hier Text, Absätze <strong>oder Fotos/Grafiken</strong> (per Copy-Paste / Drag & Drop) ein:</p>
    
    <!-- Editierbarer Container, der Text & Bilder unterstützt -->
    <div id="inputContainer" contenteditable="true" placeholder="Text oder Bild hier per Strg+V einfügen..."></div>
    
    <div class="button-group">
        <button id="evalButton" onclick="startReview()">Evaluierung starten</button>
        <button class="secondary" onclick="resetInputs()">Neue Eingabe</button>
    </div>

    <div id="results"></div>

    <script>
        async function startReview() {
            const container = document.getElementById('inputContainer');
            const evalBtn = document.getElementById('evalButton');
            const text = container.innerText.trim();
            
            // Prüfen, ob ein Bild im Container eingefügt wurde
            const imgElement = container.querySelector('img');
            let imageBase64 = null;
            let mimeType = "image/png";

            if (imgElement) {
                const base64Data = imgElement.src;
                if (base64Data.startsWith('data:')) {
                    const parts = base64Data.split(',');
                    mimeType = parts[0].match(/:(.*?);/)[1];
                    imageBase64 = parts[1];
                }
            }

            if (!text && !imageBase64) {
                alert('Bitte Text oder ein Bild eingeben');
                return;
            }
            
            // Button-Zustand: Evaluierung läuft (Gelb: #FFD700, Textschwarz für besseren Kontrast auf Gelb)
            evalBtn.innerText = 'Evaluierung läuft';
            evalBtn.style.backgroundColor = '#FFD700';
            evalBtn.style.color = '#000';
            evalBtn.disabled = true;

            const resDiv = document.getElementById('results');
            resDiv.style.display = 'block';
            resDiv.innerHTML = 'Prüfung läuft... Bitte warten (Agenten A, B und C analysieren Text/Grafik)...';
            
            try {
                const response = await fetch('/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text: text, 
                        image: imageBase64,
                        mime_type: mimeType
                    })
                });
                
                const data = await response.json();
                
                if (response.status !== 200) {
                    throw new Error(data.error || 'Unbekannter Serverfehler');
                }

                // Button-Zustand: Evaluierung abgeschlossen (Grün: #31C950, Text wieder weiß)
                evalBtn.innerText = 'Evaluierung abgeschlossen';
                evalBtn.style.backgroundColor = '#31C950';
                evalBtn.style.color = '#fff';

                let critiqueHtml = '';
                data.kritikpunkte.forEach(item => {
                    critiqueHtml += `<div class="critique"><strong>${item.kategorie}</strong><br><em>\"${item.original_zitat}\"</em><br>${item.kritikpunkt}<br><small>Evidenz: ${item.evidenz_nachweis}</small></div>`;
                });

                let originalDisplayHtml = escapeHtml(text);
                if (imgElement) {
                    originalDisplayHtml += `<br><img src="${imgElement.src}" style="max-width:100%; margin-top:10px;">`;
                }

                resDiv.innerHTML = `
                    <h2>Gutachten</h2>
                    <p><strong>Tendenz:</strong> ${data.gesamtnote_tendenz}</p>
                    ${critiqueHtml}
                    <h3>Vergleich: Ursprüngliche Eingabe vs. Überarbeiteter Vorschlag</h3>
                    <div class="comparison-container">
                        <div class="comparison-column original-col">
                            <span class="column-title">Original (Text / Grafik)</span>
                            <div>${originalDisplayHtml}</div>
                        </div>
                        <div class="comparison-column revised-col">
                            <span class="column-title">Überarbeiteter Vorschlag</span>
                            ${data.ueberarbeiteter_absatz}
                        </div>
                    </div>
                `;
            } catch (error) {
                // Bei Fehler Button wieder freigeben
                evalBtn.innerText = 'Evaluierung starten';
                evalBtn.style.backgroundColor = '#007bff';
                evalBtn.style.color = '#fff';
                evalBtn.disabled = false;

                resDiv.innerHTML = 'Fehler bei der Verarbeitung: ' + error.message;
                console.error(error);
            }
        }

        function resetInputs() {
            document.getElementById('inputContainer').innerHTML = '';
            const resDiv = document.getElementById('results');
            resDiv.style.display = 'none';
            resDiv.innerHTML = '';

            // Button in den ursprünglichen Standardzustand zurücksetzen
            const evalBtn = document.getElementById('evalButton');
            evalBtn.innerText = 'Evaluierung starten';
            evalBtn.style.backgroundColor = '#007bff';
            evalBtn.style.color = '#fff';
            evalBtn.disabled = false;
        }

        function escapeHtml(string) {
            return string
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
